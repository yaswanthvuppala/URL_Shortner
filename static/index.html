<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-start: #3b82f6;
            --accent-end: #8b5cf6;
            --accent-hover: #4f46e5;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="url"] {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="url"]:focus {
            border-color: var(--accent-start);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input[type="url"]::placeholder {
            color: var(--text-muted);
        }

        button {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(to right, var(--accent-start), var(--accent-end));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        #result-container {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--card-border);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
        }

        #short-url {
            color: var(--accent-start);
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            text-align: left;
            margin-right: 1rem;
            transition: color 0.2s ease;
        }

        #short-url:hover {
            color: var(--accent-end);
        }

        #copy-btn {
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
            background: var(--card-border);
        }

        #copy-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #error-message {
            margin-top: 1rem;
            color: var(--error);
            font-size: 0.9rem;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        
        .api-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        
        .api-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>URL Shortener</h1>
        <p class="subtitle">Paste your long link below to get a clean, short URL.</p>

        <form id="shorten-form">
            <div class="input-wrapper">
                <input type="url" id="url-input" placeholder="https://example.com/very/long/path" required autocomplete="off">
            </div>
            <button type="submit" id="submit-btn">Shorten URL</button>
        </form>

        <div id="error-message" class="hidden"></div>

        <div id="result-container" class="hidden">
            <p style="font-size: 0.9rem; color: var(--text-muted); text-align: left;">Your shortened URL is ready:</p>
            <div class="result-box">
                <a id="short-url" href="#" target="_blank"></a>
                <button id="copy-btn">Copy</button>
            </div>
        </div>
        
        <a href="/docs" class="api-link">View API Documentation →</a>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const input = document.getElementById('url-input');
        const submitBtn = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');
        const shortUrlEl = document.getElementById('short-url');
        const copyBtn = document.getElementById('copy-btn');
        const errorMsg = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset state
            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Shortening...';

            const long_url = input.value.trim();

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ long_url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail?.[0]?.msg || data.detail || 'Failed to shorten URL');
                }

                // Success
                shortUrlEl.href = data.short_url;
                shortUrlEl.textContent = data.short_url;
                resultContainer.classList.remove('hidden');
                copyBtn.textContent = 'Copy';
                input.value = ''; // clear input

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Shorten URL';
            }
        });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(shortUrlEl.href);
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.style.background = 'var(--success)';
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.background = 'var(--card-border)';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        });
    </script>
</body>
</html>
